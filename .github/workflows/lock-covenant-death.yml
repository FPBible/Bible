name: Lock covenantal death dictionary

on:
  workflow_dispatch: {}
  push:
    paths:
      - scripts/add_parousia_links.py
      - .github/workflows/lock-covenant-death.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Parousia links
        run: python3 scripts/add_parousia_links.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eighth-day-reality.html new-creation-last-adam.html index.html about.html begin.html sitemap.xml
          if git diff --cached --quiet; then
            echo No content changes
          else
            git commit -m "Add Parousia to book tabs, homepage, and sitemap"
            git push
          fi
