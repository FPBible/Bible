name: Lock covenantal death dictionary

on:
  workflow_dispatch: {}
  push:
    paths:
      - scripts/lock_covenant_death.py
      - .github/workflows/lock-covenant-death.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Apply lock replacements
        run: python3 scripts/lock_covenant_death.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ephesians/eph2.html 1Corinthians/1cor2.html Philippians/phil3.html 2Thessalonians/2thess1.html 1Thessalonians/1thess4.html 1Thessalonians/1thess5.html Thoughts/index.html John/john11.html
          if git diff --cached --quiet; then
            echo No content changes
          else
            git commit -m "Pass 2: lock remaining covenantal-death stock lines in place"
            git push
          fi
