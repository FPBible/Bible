name: Lock covenantal death dictionary

on:
  workflow_dispatch: {}
  push:
    paths:
      - scripts/lock_covenant_death.py
      - .github/workflows/lock-covenant-death.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Apply lock replacements
        run: python3 scripts/lock_covenant_death.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1Thessalonians/1thess4.html Ephesians/eph2.html Isaiah/isa65-66.html
          if git diff --cached --quiet; then
            echo No content changes
          else
            git commit -m "Pass 3: recast remaining biological-death commentary in place"
            git push
          fi
